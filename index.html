<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PW Media Sniffer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #0a0a0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,200,100,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,100,0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    .card {
      background: rgba(15,20,15,0.95);
      border: 1px solid rgba(0,200,100,0.25);
      border-radius: 12px;
      padding: 36px 32px;
      max-width: 420px;
      width: 92%;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,200,100,0.08);
      position: relative;
      z-index: 1;
    }

    .logo {
      font-size: 13px;
      letter-spacing: 4px;
      color: #00c864;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    p {
      font-size: 13px;
      color: #888;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .launch-btn {
      background: linear-gradient(135deg, #00c864, #007a3d);
      color: #000;
      font-family: 'Courier New', monospace;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 2px;
      border: none;
      padding: 14px 32px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: transform 0.15s, box-shadow 0.15s;
      text-transform: uppercase;
    }
    .launch-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0,200,100,0.3);
    }
    .launch-btn:active { transform: scale(0.97); }

    .note {
      margin-top: 20px;
      font-size: 11px;
      color: #555;
    }
    .note span { color: #00c864; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="card">
    <div class="logo">⬡ Media Sniffer</div>
    <h1>PW Thor Extractor</h1>
    <p>pwthor.live pe jao, videos/PDFs browse karo — sniffer background mein sab URLs capture karta rahega.</p>
    <button class="launch-btn" onclick="launchSniffer()">🚀 Launch &amp; Start Sniffing</button>
    <div class="note">Redirect hoga → <span>pwthor.live</span> pe</div>
  </div>

  <script>
    function launchSniffer() {
      // Open pwthor.live, inject sniffer via opener or postMessage approach
      // Since cross-origin injection via window.open is blocked, we use a bookmarklet-style approach
      // Instead, we open the sniffer overlay page as a floating tool
      window.location.href = 'sniffer.html';
    }
  </script>
</body>
</html>
